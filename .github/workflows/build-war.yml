name: Build and Deploy Fineract WAR

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set Gradle memory & disable daemon
        run: |
          echo "org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build WAR (skip tests & docs)
        run: |
          ./gradlew :fineract-provider:war -x test -x asciidoctor --no-daemon --warning-mode=none
          if [ ! -f fineract-provider/build/libs/fineract-provider.war ]; then
            echo "❌ WAR file was not generated. Build failed."
            exit 1
          fi

      - name: Upload WAR to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "fineract-provider/build/libs/fineract-provider.war"
          target: "/var/lib/tomcat9/webapps/"

      - name: Restart Tomcat on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Restarting Tomcat..."
            systemctl restart tomcat9
            sleep 10
