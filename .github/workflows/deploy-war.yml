name: Build and Deploy Fineract WAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ⚙️ Build Only the WAR
        run: ./gradlew :fineract-provider:assemble -x test -x asciidoctor -x asciidoctorPdf --no-daemon --warning-mode all

      - name: 📂 List Output WAR File
        run: ls -lh fineract-provider/build/libs/

      - name: ✅ Ensure WAR Exists
        run: |
          if [ ! -f fineract-provider/build/libs/fineract-provider.war ]; then
            echo "❌ WAR file not found!"
            exit 1
          fi

      - name: 🚀 Upload WAR to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "fineract-provider/build/libs/fineract-provider.war"
          target: "/var/lib/tomcat9/webapps/"

      - name: 🔁 Restart Tomcat
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            systemctl restart tomcat9
            sleep 5
            systemctl status tomcat9
