name: Build and Deploy Fineract WAR

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Gradle memory limits
        run: |
          echo "org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Build WAR only (skip tests/docs to prevent OOM)
        run: ./gradlew :fineract-provider:bootJar -x test --no-daemon --stacktrace

      - name: Rename output to expected WAR name
        run: |
          mkdir -p build/libs
          cp fineract-provider/build/libs/*.jar build/libs/fineract-provider.war

      - name: Upload WAR to Tomcat server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/libs/fineract-provider.war"
          target: "/var/lib/tomcat9/webapps/"

      - name: Restart Tomcat
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            systemctl restart tomcat9
            sleep 10
