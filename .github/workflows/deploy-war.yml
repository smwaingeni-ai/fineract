name: Build and Deploy Fineract WAR

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Gradle memory
        run: |
          echo "org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Inject temporary config to fix ':resolve' issue
        run: |
          mkdir -p fineract-provider/config
          cat <<EOF > fineract-provider/config/fineract.properties
fineract_tenants_config_file=./tenants.json
EOF
          echo '[{"name":"default","description":"Default Tenant","identifier":"default","databaseName":"fineract_default"}]' > fineract-provider/config/tenants.json

      - name: Build WAR (skip tests/docs)
        run: |
          ./gradlew clean :fineract-provider:war -x test -x asciidoctor --no-daemon --warning-mode=none
          if [ ! -f fineract-provider/build/libs/fineract-provider.war ]; then
            echo "❌ WAR file not generated. Build failed."
            exit 1
          fi

      - name: Upload WAR to Tomcat server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "fineract-provider/build/libs/fineract-provider.war"
          target: "/var/lib/tomcat9/webapps/"

      - name: Restart Tomcat
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            systemctl restart tomcat9
            sleep 10
