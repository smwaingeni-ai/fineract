name: Build and Deploy Fineract WAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🔧 Make Gradle executable
        run: chmod +x ./gradlew

      - name: 🛠️ Build WAR file (skip tests/docs/spotbugs)
        run: ./gradlew :fineract-war:war -x test -x asciidoctor -x asciidoctorPdf -x spotbugsMain -x spotbugsTest

      - name: ✅ Verify WAR file exists
        run: |
          ls -lh fineract-war/build/libs/
          if [ ! -f fineract-war/build/libs/fineract.war ]; then
            echo "❌ WAR not found. Build may have failed."
            exit 1
          fi

      - name: 🚀 Upload WAR to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "fineract-war/build/libs/fineract.war"
          target: "/var/lib/tomcat9/webapps/"

      - name: 🔄 Restart Tomcat
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            systemctl restart tomcat9
            echo "✅ Tomcat restarted"

      - name: 📡 Confirm deployment file
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "📂 Checking for deployed file:"
            ls -lh /var/lib/tomcat9/webapps/fineract.war
