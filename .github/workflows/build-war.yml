name: 🚀 Build and Deploy Fineract WAR

on:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🔧 Make Gradle Executable
        run: chmod +x ./gradlew

      - name: 🛠️ Build Fineract Provider WAR
        run: ./gradlew :fineract-provider:bootJar -x test -x asciidoctor -x asciidoctorPdf -x spotbugsMain -x spotbugsTest

      - name: 📂 Find Final WAR
        id: findwar
        run: |
          FILE=$(ls fineract-provider/build/libs/fineract-provider-*.jar | head -n 1)
          echo "WAR_PATH=$FILE" >> $GITHUB_ENV
          echo "✅ Found: $FILE"

      - name: 🚀 Upload WAR to Tomcat Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ${{ env.WAR_PATH }}
          target: /var/lib/tomcat9/webapps/fineract-provider.war

      - name: 🔁 Restart Tomcat Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart tomcat9
            echo "✅ Tomcat restarted successfully"
