name: Build WAR Only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: 11

      - name: Build Fineract WAR
        run: ./gradlew clean build -x test

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v3
        with:
          name: fineract-provider.war
          path: build/libs/fineract-provider.war
