name: Build and Deploy Fineract WAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full git history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Required for Fineract versioning logic

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build WAR (skip tests, docs, and static analysis)
        run: ./gradlew :fineract-provider:war -x test -x asciidoctor -x spotbugsMain -x spotbugsTest

      - name: Upload WAR to remote server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "fineract-provider/build/libs/fineract-provider.war"
          target: "/var/lib/tomcat9/webapps/"

      - name: Restart Tomcat on server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            systemctl restart tomcat9
            echo "✅ Tomcat restarted successfully"
