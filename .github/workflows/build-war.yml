name: Build and Deploy Fineract WAR

on:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🔧 Make Gradle executable
        run: chmod +x ./gradlew

      - name: 🛠️ Build WAR
        run: ./gradlew :fineract-provider:bootJar -x test -x asciidoctor -x asciidoctorPdf -x spotbugsMain -x spotbugsTest

      - name: 📂 List built files
        run: ls -lh fineract-provider/build/libs/

      - name: 🚀 Upload WAR to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "fineract-provider/build/libs/fineract-provider.jar"
          target: "/var/lib/tomcat9/webapps/fineract-provider.war"

      - name: 🔁 Restart Tomcat
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            systemctl restart tomcat9
            echo "✅ Tomcat restarted"
