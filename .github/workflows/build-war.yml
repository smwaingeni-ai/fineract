name: Build and Deploy Fineract WAR

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Required for Fineract versioning

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Gradle memory
        run: |
          echo "org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build WAR file (skip tests & docs, full output)
        run: ./gradlew clean build -x test -x asciidoctor --stacktrace --warning-mode all

      - name: Upload WAR to remote server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/libs/fineract-provider.war"
          target: "/var/lib/tomcat9/webapps/"

      - name: Restart Tomcat on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Restarting Tomcat..."
            systemctl restart tomcat9
            sleep 10
            echo "Tomcat restarted."
